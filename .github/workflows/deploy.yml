name: Build Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release
        run: node scripts/build-release.mjs
        env:
          NODE_ENV: production
          BASE_PATH: /

      - name: Create ZIP archive
        run: |
          cd release
          zip -r ../pata-limpa-crm.zip .
          echo "Arquivos no ZIP: $(unzip -l ../pata-limpa-crm.zip | tail -1)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pata-limpa-crm-${{ github.sha }}
          path: pata-limpa-crm.zip
          retention-days: 30

      - name: Build summary
        run: |
          echo "## Build de Produção ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deploy na Hostinger" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Baixe o artefato \`pata-limpa-crm.zip\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Extraia no servidor e configure as variáveis de ambiente:" >> $GITHUB_STEP_SUMMARY
          echo "   - \`NODE_ENV=production\`" >> $GITHUB_STEP_SUMMARY
          echo "   - \`DATABASE_URL=postgres://...\`" >> $GITHUB_STEP_SUMMARY
          echo "   - \`PORT=3000\` (opcional, padrão: 3000)" >> $GITHUB_STEP_SUMMARY
          echo "   - \`ADMIN_EMAIL=...\`" >> $GITHUB_STEP_SUMMARY
          echo "   - \`ADMIN_PASSWORD=...\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Inicie com: \`node dist/index.mjs\`" >> $GITHUB_STEP_SUMMARY
